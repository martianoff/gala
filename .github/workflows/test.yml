name: Test

on:
  pull_request:
    branches: [master]

# Checkout, build and test only; the token never needs to write.
permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Export GOROOT
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-go${{ steps.setup-go.outputs.go-version }}
          repository-cache: true

      - name: Build
        run: |
          echo "GOROOT=$GOROOT"
          bazel build //... --action_env=GOROOT="$GOROOT" --action_env=PATH

      - name: Test
        run: |
          bazel test //... \
            --test_output=errors --verbose_failures \
            --action_env=GOROOT="$GOROOT" --action_env=PATH

      - name: IntelliJ Plugin Build & Test
        run: |
          bazel build //ide/intellij:plugin --action_env=PATH

  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Install dependencies
        working-directory: ide/vscode
        run: npm ci

      - name: Typecheck and bundle
        working-directory: ide/vscode
        run: npm run compile
