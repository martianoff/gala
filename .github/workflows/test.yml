name: Test

on:
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Export GOROOT
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-go${{ steps.setup-go.outputs.go-version }}
          repository-cache: true

      - name: Build
        run: |
          echo "GOROOT=$GOROOT"
          bazel build //... --action_env=GOROOT="$GOROOT" --action_env=PATH

      - name: Test
        run: |
          bazel test //... \
            --test_output=errors --verbose_failures \
            --action_env=GOROOT="$GOROOT" --action_env=PATH

      - name: IntelliJ Plugin Build & Test
        run: |
          bazel build //ide/intellij:plugin --action_env=PATH
