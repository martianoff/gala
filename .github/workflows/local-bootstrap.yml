name: Local bootstrap — nix build .#gala-local

# `gala-local` (nix/gala.nix with useLocalBootstrap) transpiles the stdlib with
# cmd/gala_bootstrap built from this tree, in its batch mode: every stdlib file
# in one `--inputs` call. Bazel never uses that mode — it runs the bootstrap
# once per file with an explicit package_files list — so the Bazel lanes
# cannot see a batch-only break. One shipped anyway: the batch analyzer stopped
# resolving the stdlib `test` package's sibling types, and gala-local failed to
# build with nothing in CI to say so (#678).
#
# This lane builds gala-local, then packs its transpiled stdlib with
# cmd/stdlib_gen and diffs the result against Bazel's generate_embedded. The
# two take the same sources through the same transpiler, so any difference is
# the batch path disagreeing with the per-file path.
#
# The path filter keeps it off PRs that cannot move either side (docs,
# examples, the IDE plugin, other workflows). The cost of the filter: a PR that
# breaks gala-local only through a file outside it goes unflagged until the
# next PR that touches one of these paths.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/local-bootstrap.yml"
      - "cmd/gala_bootstrap/**"
      - "cmd/stdlib_gen/**"
      - "internal/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "gala.mod"
      # The stdlib packages nix/gala.nix transpiles (its stdlibPkgs list).
      - "collection_immutable/**"
      - "collection_mutable/**"
      - "concurrent/**"
      - "crypto/**"
      - "fs/**"
      - "go_builtins/**"
      - "go_interop/**"
      - "io/**"
      - "json/**"
      - "lazy/**"
      - "path/**"
      - "regex/**"
      - "resource/**"
      - "std/**"
      - "stream/**"
      - "strings/**"
      - "subprocess/**"
      - "test/**"
      - "time_utils/**"
      - "validation/**"
      - "yaml/**"

# Checkouts and builds only; the token never needs to write.
permissions:
  contents: read

concurrency:
  group: local-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gala-local:
    name: gala-local builds and matches Bazel's stdlib
    runs-on: ubuntu-latest
    # No Nix binary cache is configured, so every run builds the bootstrap,
    # the vendored Go deps and the CLI from cold.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      # Bazel's transpile actions read GOROOT for Go type inference.
      - name: Export GOROOT
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          # A key of its own, as every other lane has.
          disk-cache: local-bootstrap-${{ steps.setup-go.outputs.go-version }}
          repository-cache: true

      - name: Build gala-local
        run: nix build .#gala-local --print-build-logs

      - name: Build the Bazel stdlib
        run: bazel build //internal/stdlib:generate_embedded //cmd/stdlib_gen

      - name: Compare the local-bootstrap stdlib with Bazel's
        run: |
          set -euo pipefail
          # Already built as gala-local's input; this only links it.
          nix build .#gala-local.localTranspiled --out-link local-stdlib
          mapfile -t files < <(find local-stdlib/files -type f | sort)
          echo "packing ${#files[@]} local-bootstrap inputs"
          ./bazel-bin/cmd/stdlib_gen/stdlib_gen_/stdlib_gen \
            -output "$RUNNER_TEMP/local_embedded_gen.go" "${files[@]}"
          if ! diff -u "$RUNNER_TEMP/local_embedded_gen.go" \
                      bazel-bin/internal/stdlib/embedded_gen.go > "$RUNNER_TEMP/local.diff"; then
            echo "::error::The local-bootstrap stdlib and Bazel's generate_embedded disagree"
            head -60 "$RUNNER_TEMP/local.diff"
            exit 1
          fi
          echo "local-bootstrap stdlib matches Bazel's embedded_gen.go"
