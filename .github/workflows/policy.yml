name: Repo Policy

# Mechanical AGENTS.md rules; see tools/check_repo_policy.sh. Separate from the
# Bazel workflow so `edited` can re-run it when a PR title or description
# changes: the check takes seconds, and a re-run reuses the old event payload.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  policy:
    name: Repo Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Commit messages since the merge base are checked too.
          fetch-depth: 0

      - name: Check repo policy
        # Via env, never inlined into the script: PR text is untrusted input.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: tools/check_repo_policy.sh "origin/${{ github.base_ref }}"
