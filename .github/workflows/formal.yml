name: Formal

# Builds the Lean semantics in formal/ and checks its proofs, then compares galaspec,
# the Lean reference interpreter, with the transpiler (internal/formal/difftest). See
# formal/README.md and docs/FORMAL_SEMANTICS.MD. Lean is built with Lake here, never
# with Bazel, so the Bazel workflows stay Lean-free.
#
# It runs for every change that can move a differential verdict: the spec, the
# harness and exporter, the transpiler, the standard library and the examples.
on:
  pull_request:
    branches: [master]
    paths:
      - 'formal/**'
      - 'internal/formal/**'
      - 'internal/transpiler/**'
      - 'std/**'
      - 'collection_immutable/**'
      - 'go_builtins/**'
      - 'go_interop/**'
      - 'galaerr/**'
      - 'examples/**'
      - '.github/workflows/formal.yml'
  push:
    branches: [master]
    paths:
      - 'formal/**'
      - 'internal/formal/**'
      - 'internal/transpiler/**'
      - 'std/**'
      - 'collection_immutable/**'
      - 'go_builtins/**'
      - 'go_interop/**'
      - 'galaerr/**'
      - 'examples/**'
      - '.github/workflows/formal.yml'

permissions:
  contents: read

# A newer push to the same PR supersedes the running check.
concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formal:
    name: Lean proofs
    runs-on: ubuntu-latest
    # A runaway `decide` or kernel reduction must not hold a runner for hours.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve the pinned toolchain
        # formal/lean-toolchain is the only place the version is set. Each version needs
        # the SHA-256 of its Linux release asset here (from the release's asset digests);
        # a version without one fails rather than installing unverified.
        id: lean
        run: |
          # The release assets in the table are for x86_64 Linux.
          if [ "$RUNNER_OS-$RUNNER_ARCH" != Linux-X64 ]; then
            echo "::error::the Lean checksum table covers Linux X64 only, not $RUNNER_OS-$RUNNER_ARCH"
            exit 1
          fi
          pin="$(tr -d '[:space:]' < lean-toolchain)"
          version="$(printf '%s' "$pin" | sed -nE 's#^leanprover/lean4:v?([0-9]+\.[0-9]+\.[0-9]+)$#\1#p')"
          if [ -z "$version" ]; then
            echo "::error file=formal/lean-toolchain::expected leanprover/lean4:vX.Y.Z, found '$pin'"
            exit 1
          fi
          case "$version" in
            4.35.0) sha256=7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d ;;
            *)
              echo "::error file=formal/lean-toolchain::formal/lean-toolchain pins $version, which has no SHA-256 in .github/workflows/formal.yml; add one"
              exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "sha256=$sha256"
            echo "archive=$HOME/.lean-dist/lean-$version-linux.tar.zst"
          } >> "$GITHUB_OUTPUT"

      - name: Cache the Lean release archive
        # A CI-private cache, never served to anyone, so not re-hosting
        # (docs/FORMAL_SEMANTICS.MD, "Licensing"). It holds the archive, not the
        # unpacked tree, so the checksum below is verified on every run.
        uses: actions/cache@v4
        with:
          path: ${{ steps.lean.outputs.archive }}
          key: lean-${{ runner.os }}-${{ steps.lean.outputs.sha256 }}

      - name: Install the Lean toolchain
        # Fetched from Lean's own release host (which redirects to the GitHub release; the
        # direct GitHub URL is the fallback), verified against the pinned SHA-256 and
        # unpacked. No elan: the verified toolchain's bin/ goes on PATH, so lake runs
        # exactly it.
        env:
          VERSION: ${{ steps.lean.outputs.version }}
          SHA256: ${{ steps.lean.outputs.sha256 }}
          ARCHIVE: ${{ steps.lean.outputs.archive }}
        run: |
          asset="$(basename "$ARCHIVE")"
          if [ ! -f "$ARCHIVE" ]; then
            mkdir -p "$(dirname "$ARCHIVE")"
            for host in https://releases.lean-lang.org/lean4 https://github.com/leanprover/lean4/releases/download; do
              curl -sSfL --retry 2 -o "$ARCHIVE" "$host/v$VERSION/$asset" && break
            done
          fi
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$ARCHIVE" -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/lean-$VERSION-linux/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        env:
          VERSION: ${{ steps.lean.outputs.version }}
        run: |
          lean --version | tee /dev/stderr | grep -qF "version $VERSION," \
            || { echo "::error::lean on PATH is not $VERSION"; exit 1; }
          [ "$(command -v lake)" = "$(dirname "$(command -v lean)")/lake" ] \
            || { echo "::error::lake on PATH is not the pinned toolchain's"; exit 1; }

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}-${{ hashFiles('formal/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}-

      - name: Build
        # --wfail: a warning (an unused simp argument, a deprecated lemma) fails too.
        run: lake build --wfail

      - name: Check proofs
        # lake build only warns on sorry; this fails on sorry and non-standard axioms.
        run: lake env lean --run scripts/ProofCheck.lean

      - name: Build galaspec
        run: lake build --wfail galaspec galaspec-tests

      - name: Test galaspec
        # The #guard checks run while the tests compile; this runs the Core JSON
        # fixtures in formal/tests through the interpreter.
        run: lake exe galaspec-tests

      - name: Smoke-test the galaspec command line
        # The exit code and the last stderr line are the contract the differential
        # harness relies on.
        run: |
          set +e
          lake exe galaspec run tests/panic_divide.json > out.txt 2> err.txt
          code=$?
          set -e
          cat out.txt err.txt
          test "$code" = 1
          test "$(tail -n 1 err.txt)" = "galaspec: outcome=panic:divide"
          test "$(cat out.txt)" = "before"

      - name: Deep recursion
        # A million nested calls (examples/tco_deep_sum) must finish, not overflow the
        # interpreter's stack, when given the fuel for it.
        run: |
          out="$(lake exe galaspec run --fuel 100000000 tests/ex_tco_deep_sum.json)"
          test "$out" = "500000500000"

  # The differential run (docs/FORMAL_SEMANTICS.MD, "Differential harness"): every
  # example with a .out file and a sample of FuzzPrograms' programs, run through
  # galaspec and through the transpiler and Go. A DISAGREE not listed in
  # internal/formal/difftest/known_disagreements.json fails it, and so does a fall in
  # the number of agreeing examples. Its coverage section and summary go to the job
  # summary.
  difftest:
    name: Differential run
    # After the proofs job, so it restores the Lake build that job cached rather than
    # building Lean a second time in parallel.
    needs: formal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Reads the issues known_disagreements.json lists, to check they are open.
      issues: read
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      OUTPUTS: bazel-testlogs/internal/formal/difftest/differential/differential_test/test.outputs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Known disagreements are open issues
        # A known disagreement stays listed only while its issue is open; the PR
        # that fixes it removes the entry (the harness fails on a listed program
        # that agrees). An issue closed without a fix must take its entry with it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for n in $(jq -r '.[].issue' internal/formal/difftest/known_disagreements.json); do
            state="$(gh api "repos/${{ github.repository }}/issues/$n" --jq .state)"
            if [ "$state" != open ]; then
              echo "::error::#$n is $state: remove its entry from internal/formal/difftest/known_disagreements.json"
              status=1
            fi
          done
          exit $status

      - name: Is galaspec defined?
        # galaspec is a Lake executable in formal/lakefile.toml. Until it exists the
        # harness is checked only against its stub (//internal/formal/difftest:difftest_test,
        # part of bazel test //...), and this job says so in its summary. The check goes
        # once galaspec is on master.
        id: spec
        run: |
          if grep -Eq '^name = "galaspec"' formal/lakefile.toml; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Differential run: not run"
              echo
              echo "formal/lakefile.toml defines no galaspec executable yet, so no program was compared with the spec."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache elan and the Lean toolchain
        if: steps.spec.outputs.defined == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ env.ELAN_VERSION }}-${{ hashFiles('formal/lean-toolchain') }}

      - name: Cache Lake build
        if: steps.spec.outputs.defined == 'true'
        uses: actions/cache@v4
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}-${{ hashFiles('formal/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}-

      - name: Install elan
        if: steps.spec.outputs.defined == 'true'
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            tmp="$(mktemp -d)"
            curl -sSfL -o "$tmp/elan.tar.gz" \
              "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "$ELAN_SHA256  $tmp/elan.tar.gz" | sha256sum -c -
            tar -xzf "$tmp/elan.tar.gz" -C "$tmp"
            "$tmp/elan-init" -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build galaspec
        if: steps.spec.outputs.defined == 'true'
        working-directory: formal
        run: |
          lake build galaspec
          echo "GALA_SPEC_BIN=$PWD/.lake/build/bin/galaspec" >> "$GITHUB_ENV"

      - name: Setup Go
        if: steps.spec.outputs.defined == 'true'
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Export GOROOT
        if: steps.spec.outputs.defined == 'true'
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Setup Bazel
        if: steps.spec.outputs.defined == 'true'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-difftest-go${{ steps.setup-go.outputs.go-version }}
          repository-cache: true

      - name: Differential run
        if: steps.spec.outputs.defined == 'true'
        # The fuel is enough for examples/tco_deep_sum's million nested calls.
        # --nocache_test_results: galaspec is not a Bazel input, so a cached
        # result could predate a change to the spec.
        run: |
          bazel test //internal/formal/difftest/differential:differential_test \
            --test_env=GALA_SPEC_BIN \
            --test_env=GALA_SPEC_FUEL=100000000 \
            --nocache_test_results \
            --nozip_undeclared_test_outputs \
            --test_output=errors --verbose_failures \
            --action_env=GOROOT="$GOROOT" --action_env=PATH

      - name: Keep the run's report
        # coverage_section.md is what formal/COVERAGE.md carries; download it and
        # run splicecoverage on it to update the file.
        if: always() && steps.spec.outputs.defined == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: difftest-report
          path: ${{ env.OUTPUTS }}/*.md
          if-no-files-found: ignore

      - name: Publish the coverage summary
        if: always() && steps.spec.outputs.defined == 'true'
        run: |
          if [ ! -f "$OUTPUTS/summary.md" ]; then
            echo "## Differential run: no report (the run failed before writing one)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$OUTPUTS/summary.md" "$OUTPUTS/coverage_section.md" >> "$GITHUB_STEP_SUMMARY"
          # formal/COVERAGE.md carries the section; say when the committed one is stale.
          bazel run //internal/formal/difftest/splicecoverage \
            --action_env=GOROOT="$GOROOT" --action_env=PATH -- "$PWD/$OUTPUTS/coverage_section.md"
          if ! git diff --quiet -- formal/COVERAGE.md; then
            {
              echo
              echo "formal/COVERAGE.md is out of date with this run: run the differential test and"
              echo "\`bazel run //internal/formal/difftest/splicecoverage -- <its coverage_section.md>\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
