name: Perf — real-repo build budget

# Manual + nightly only. The synthetic perf tests
# (//internal/transpiler/analyzer:analyzer_test //
# TestCachedRichAST_GobSizeBounded and TestCacheE2E_DiskFootprintBounded)
# run on every PR and are the fast feedback loop. This lane builds a real
# downstream repo (gala_team) against the upstream gala module to catch
# regressions that the synthetic fixture is too small to surface — typically
# issues where the analyzer cache is correctly small but per-package
# transpile work has grown elsewhere (parser, transformer, or Go-type
# extraction).
#
# Thresholds are calibrated for ubuntu-latest GitHub Actions runners
# (4 vCPU, 16 GB) — not the maintainer's local hardware, which is roughly
# 3-5x faster. Cold floor is dominated by full-closure ANTLR parsing of
# gala_team's apex transpile (`cmd/main.gala` dot-imports the whole
# module ≈ 100 packages); persistent-worker mode + memo'd analyzer paths
# get this down from ~1160 s to ~400 s as of PR #317. They should ratchet
# downward any time a perf improvement lands; never upward without a
# documented reason in the PR description.
#
# Cold budget raised 600 s -> 680 s for the GALA 0.70 release: the stdlib
# gained the `resource` and `go_builtins` packages, which gala_team's apex
# `cmd/main.gala` pulls into its transitive dot-import closure, adding real
# from-scratch transpile work. A fresh-disk-cache run was measured at 604 s
# (vs the prior ~400 s floor); 680 s restores ~12% headroom for runner
# variance while still firmly trapping a regression (pre-worker was ~1160 s).
# The cache-size ceiling below is unchanged, so a per-entry blowup is still
# caught independently of wall time.
#
# Cold budget raised 680 s -> 850 s. Read the "Cold build" step below for
# what it actually measures: setup-bazel restores a Bazel disk cache keyed
# on `perf-real-build-<go-version>`, so the step is only cold when that key
# misses. Measured runs split cleanly along that line rather than along any
# source change:
#
#   disk-cache RESTORED   77 s / 364 s / 416 s / 589 s
#   disk-cache MISSED    648 s / 670 s / 672 s / 750 s
#
# 680 s sat inside the cache-miss cluster, so a genuine cold run was close
# to a coin flip and the gate reddened PRs that changed nothing relevant —
# including a docs-only PR and a version bump. 850 s clears the worst
# observed true-cold run (750 s) by ~13%.
#
# Note this is a re-baseline, not permission for the build to get slower:
# the two clusters are not comparable, and any 400-ish figure quoted from
# an earlier run was a cache-hit measurement. Judge a regression against
# runs with the same cache disposition, and keep ratcheting the number
# down as perf work lands. The right long-term shape is a rolling baseline
# instead of a fixed constant, which would not need this maintenance and
# would not silently absorb drift; a fixed constant will land back here.

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  schedule:
    # 04:17 UTC nightly — small offset to dodge the top-of-hour
    # GitHub Actions traffic spike.
    - cron: "17 4 * * *"

jobs:
  real-repo-build:
    name: Build gala_team against this branch
    runs-on: ubuntu-latest
    # Even a v1 baseline run finishes in well under 10 minutes;
    # a 30-minute ceiling traps a runaway regression without
    # paying for a worker forever.
    timeout-minutes: 30

    # NOTE: pin tags before running. Update both when the gala_tui
    # or gala_team API surface intentionally changes; otherwise the
    # build failures will reveal real semantic drift.
    env:
      GALA_TUI_REF: main
      GALA_TEAM_REF: master
      WARM_BUDGET_SECONDS: "500"
      COLD_BUDGET_SECONDS: "850"

    steps:
      - name: Checkout gala (this branch)
        uses: actions/checkout@v4
        with:
          path: gala_simple

      - name: Checkout gala_tui
        uses: actions/checkout@v4
        with:
          repository: martianoff/gala-tui
          ref: ${{ env.GALA_TUI_REF }}
          path: gala_tui

      - name: Checkout gala_team
        uses: actions/checkout@v4
        with:
          repository: martianoff/gala-team
          ref: ${{ env.GALA_TEAM_REF }}
          path: gala_team

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Export GOROOT
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: perf-real-build-${{ steps.setup-go.outputs.go-version }}
          repository-cache: true

      - name: Cold build
        working-directory: gala_team
        run: |
          set -euo pipefail
          # Report whether setup-bazel restored a disk cache. Without this
          # the wall time below is uninterpretable: a restored cache and a
          # missed one differ by ~10x, which reads as a regression when it
          # is only cache disposition. Pure logging — never fails the step.
          # setup-bazel writes `common --disk_cache=<dir>` into ~/.bazelrc
          # whether or not the cache key hit, so presence of the flag proves
          # nothing — count entries instead.
          disk_cache=$(grep -hoE -- '--disk_cache=[^[:space:]]+' "$HOME/.bazelrc" 2>/dev/null | head -1 | cut -d= -f2- || true)
          entries=0
          if [ -n "${disk_cache:-}" ] && [ -d "$disk_cache" ]; then
            entries=$(find "$disk_cache" -type f 2>/dev/null | wc -l || echo 0)
          fi
          if [ "${entries:-0}" -gt 0 ]; then
            echo "Disk cache RESTORED: ${entries} entries in ${disk_cache} ($(du -sh "$disk_cache" 2>/dev/null | cut -f1 || echo '?'))"
          else
            echo "Disk cache MISSED — this is a true from-scratch cold build"
          fi
          start=$(date +%s)
          bazel build //cmd:gala_team \
            --override_module=gala=$GITHUB_WORKSPACE/gala_simple \
            --override_module=gala_tui=$GITHUB_WORKSPACE/gala_tui \
            --registry=https://raw.githubusercontent.com/martianoff/rules-gala/main/ \
            --registry=https://bcr.bazel.build \
            --action_env=GOROOT="$GOROOT" --action_env=PATH
          end=$(date +%s)
          elapsed=$((end - start))
          echo "Cold build wall: ${elapsed}s (budget ${COLD_BUDGET_SECONDS}s)"
          if [ "$elapsed" -gt "$COLD_BUDGET_SECONDS" ]; then
            echo "::error::Cold build exceeded ${COLD_BUDGET_SECONDS}s budget (took ${elapsed}s)"
            exit 1
          fi

      - name: Warm build
        working-directory: gala_team
        run: |
          set -euo pipefail
          # Force genrule re-execution against the populated analyzer
          # disk cache so the timing reflects analyzer-cache HITs,
          # not Bazel action-cache HITs.
          start=$(date +%s)
          bazel build //cmd:gala_team \
            --override_module=gala=$GITHUB_WORKSPACE/gala_simple \
            --override_module=gala_tui=$GITHUB_WORKSPACE/gala_tui \
            --registry=https://raw.githubusercontent.com/martianoff/rules-gala/main/ \
            --registry=https://bcr.bazel.build \
            --action_env=GOROOT="$GOROOT" --action_env=PATH \
            --action_env=PERF_RUN=warm-$(date +%s)
          end=$(date +%s)
          elapsed=$((end - start))
          echo "Warm build wall: ${elapsed}s (budget ${WARM_BUDGET_SECONDS}s)"
          if [ "$elapsed" -gt "$WARM_BUDGET_SECONDS" ]; then
            echo "::error::Warm build exceeded ${WARM_BUDGET_SECONDS}s budget (took ${elapsed}s)"
            exit 1
          fi

      - name: Cache size budget
        working-directory: gala_team
        run: |
          set -euo pipefail
          if [ ! -d .gala/cache ]; then
            echo "::warning::no .gala/cache directory; analyzer cache may have been disabled"
            exit 0
          fi
          # Each individual analyzer cache entry should stay tiny; the
          # symptom we care about is per-entry blowup (a hub package
          # inlining its full transitive type closure), so we cap the
          # largest single .gob.
          biggest=$(find .gala/cache -name '*.gob' -printf '%s\n' | sort -nr | head -1 || echo 0)
          biggest=${biggest:-0}
          echo "Largest cache entry: ${biggest} bytes"
          # 5 MiB ceiling — pre-fix saw 138 MiB for app/cli; even with
          # a stdlib bigger than today's, ~5 MiB is loose-but-firm.
          if [ "$biggest" -gt $((5 * 1024 * 1024)) ]; then
            echo "::error::A single cache entry is ${biggest} bytes (>5 MiB) — likely a transitive-merge regression"
            exit 1
          fi
