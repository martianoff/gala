title: "GALA"
tagline: "Scala on Go."
description: "Scala on Go. A statically typed, functional-first language that transpiles to Go — sealed types, pattern matching, monads, full Go interop."
url: "https://gala.fyi"
baseurl: ""
theme: null
remote_theme: pages-themes/minimal@v0.2.0

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

google_analytics: ""

social:
  name: GALA
  links:
    - https://github.com/martianoff/gala

collections:
  features:
    output: true
    permalink: /features/:name/
